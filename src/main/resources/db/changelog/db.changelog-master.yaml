package ru.pskb.integrator.service.activation;

import lombok.RequiredArgsConstructor;
import lombok.extern.slf4j.Slf4j;
import org.springframework.stereotype.Service;
import org.springframework.transaction.annotation.Transactional;
import ru.pskb.integrator.dto.activation.ActivationRequest;
import ru.pskb.integrator.dto.activation.ActivationResponse;
import ru.pskb.integrator.entity.activation.Activation;
import ru.pskb.integrator.entity.activation.ActivationRefinancedLoan;
import ru.pskb.integrator.mapper.activation.ActivationMapper;
import ru.pskb.integrator.repository.activation.ActivationRepository;
import ru.pskb.integrator.service.ApplicationHistoryLogger; // уже есть в проекте
import ru.pskb.integrator.ibso.DirectIbsoService;

import java.time.LocalDateTime;
import java.util.List;
import java.util.Optional;

/**
 * ActivationServiceImpl
 * Реализация логики активации:
 * - сохраняет Activation (PENDING),
 * - пытается отправить задачу в ИБСО (в try/catch) через DirectIbsoService.sendActivation(...)
 * - при успехе — обновляет статус в БД,
 * - при неудаче — оставляет PENDING (scheduler повторит попытку).
 *
 * Также предоставляет метод получения статуса активации (getActivationStatus).
 */
@Slf4j
@Service
@RequiredArgsConstructor
public class ActivationServiceImpl implements ActivationService {

    private final ActivationRepository activationRepository;
    private final ActivationMapper activationMapper;
    private final DirectIbsoService directIbsoService;
    private final ApplicationHistoryLogger historyLogger;

    @Override
    @Transactional
    public ActivationResponse activate(ActivationRequest request) {
        // 1) Сохраняем локальную запись (PENDING)
        Activation activation = activationMapper.requestToEntity(request);

        // временно — заполним список рефинансируемых кредитов (mapstruct не установит activation-ссылку)
        if (request.refinancedLoans() != null && !request.refinancedLoans().isEmpty()) {
            List<ActivationRefinancedLoan> loans = activationMapper.loanRequestListToEntityList(request.refinancedLoans());
            loans.forEach(l -> l.setActivation(activation));
            activation.setRefinancedLoans(loans);
            activation.setRefinancedFlag(Boolean.TRUE);
        } else {
            activation.setRefinancedFlag(Boolean.FALSE);
        }

        Activation saved = activationRepository.save(activation);
        log.info("Activation сохранён (id={}, requestId={})", saved.getId(), saved.getRequestId());

        // журналируем изменение статуса
        historyLogger.logChange(saved.getRequestId(), "ACTIVATION_CREATED", saved.getLoanAmount(), saved.getTerm(), null, "Запрос активации принят в работу");

        // 2) Попытка отправить в ИБСО (в блоке try/catch — чтобы не прервать транзакцию и не потерять данные)
        try {
            // TODO: реализовать в DirectIbsoService метод sendActivation и вернуть результат
            // Пример использования:
            // var ibsoResult = directIbsoService.sendActivation(saved);
            // симуляция:
            var ibsoResult = directIbsoService.sendActivationSimulation(saved); // временная заглушка

            if (ibsoResult != null && "successful".equalsIgnoreCase(ibsoResult.getStatus())) {
                saved.setStatus("SUCCESSFUL");
                saved.setErrorMessage(null);
                saved.setUpdatedAt(LocalDateTime.now());
                activationRepository.save(saved);

                historyLogger.logChange(saved.getRequestId(), "ACTIVATION_SUCCESS", saved.getLoanAmount(), saved.getTerm(), null, "Активация успешно выполнена в ИБСО");
                return new ActivationResponse("successful", null, saved.getRequestId());
            } else if (ibsoResult != null && "failed".equalsIgnoreCase(ibsoResult.getStatus())) {
                saved.setStatus("FAILED");
                saved.setErrorMessage(ibsoResult.getErrorMessage());
                saved.setUpdatedAt(LocalDateTime.now());
                activationRepository.save(saved);

                historyLogger.logChange(saved.getRequestId(), "ACTIVATION_FAILED", saved.getLoanAmount(), saved.getTerm(), null, "Активация завершилась с ошибкой: " + ibsoResult.getErrorMessage());
                return new ActivationResponse("failed", ibsoResult.getErrorMessage(), saved.getRequestId());
            } else {
                // ibsoResult == null или pending — оставляем PENDING и вернём приём
                log.info("Активация отправлена в ИБСО, статус ожидается. activationId={}", saved.getId());
                return new ActivationResponse("successful", null, saved.getRequestId());
            }
        } catch (Exception ex) {
            // логируем, оставляем в PENDING — шедуллер попытается позже
            log.error("Ошибка при отправке активации в ИБСО (activationId={}): {}", saved.getId(), ex.getMessage(), ex);
            saved.setStatus("PENDING");
            saved.setUpdatedAt(LocalDateTime.now());
            activationRepository.save(saved);

            historyLogger.logChange(saved.getRequestId(), "ACTIVATION_SEND_ERROR", saved.getLoanAmount(), saved.getTerm(), null, "Ошибка при отправке в ИБСО: " + ex.getMessage());
            return new ActivationResponse("successful", null, saved.getRequestId());
        }
    }

    @Override
    @Transactional(readOnly = true)
    public ActivationResponse getActivationStatus(String requestId, String mplOfferId, String bankOfferId) {
        // 1) Поиск локальной записи по мульти-параметру
        Optional<Activation> byBank = (bankOfferId != null) ? activationRepository.findByRequestIdAndBankOfferId(requestId, bankOfferId) : Optional.empty();
        Optional<Activation> byMpl = (mplOfferId != null) ? activationRepository.findByRequestIdAndMplOfferId(requestId, mplOfferId) : Optional.empty();

        Activation activation = byBank.or(() -> byMpl).orElse(null);

        if (activation == null) {
            // нет локальной записи — возвращаем failed
            return new ActivationResponse("failed", "Activation not found", requestId);
        }

        // Если статус PENDING, можно попытаться обновить у ИБСО (вне strict SLA это допустимо)
        if ("PENDING".equalsIgnoreCase(activation.getStatus())) {
            try {
                // TODO: реализовать DirectIbsoService.getActivationStatus(...) или использовать существующую заглушку
                var ibsoStatus = directIbsoService.getActivationStatusSimulation(activation.getRequestId(), activation.getMplOfferId(), activation.getBankOfferId());

                if (ibsoStatus != null) {
                    if ("successful".equalsIgnoreCase(ibsoStatus.getStatus())) {
                        activation.setStatus("SUCCESSFUL");
                        activation.setUpdatedAt(LocalDateTime.now());
                        activationRepository.save(activation);
                        return new ActivationResponse("successful", null, activation.getRequestId());
                    } else if ("failed".equalsIgnoreCase(ibsoStatus.getStatus())) {
                        activation.setStatus("FAILED");
                        activation.setErrorMessage(ibsoStatus.getErrorMessage());
                        activation.setUpdatedAt(LocalDateTime.now());
                        activationRepository.save(activation);
                        return new ActivationResponse("failed", ibsoStatus.getErrorMessage(), activation.getRequestId());
                    } else {
                        // still pending
                        return new ActivationResponse("pending", null, activation.getRequestId());
                    }
                } else {
                    return new ActivationResponse("pending", null, activation.getRequestId());
                }
            } catch (Exception ex) {
                log.warn("Ошибка при запросе статуса активации в ИБСО: {}", ex.getMessage());
                return new ActivationResponse("pending", null, activation.getRequestId());
            }
        }

        // статус уже SUCCESSFUL или FAILED — вернуть его
        if ("SUCCESSFUL".equalsIgnoreCase(activation.getStatus())) {
            return new ActivationResponse("successful", null, activation.getRequestId());
        } else {
            return new ActivationResponse("failed", activation.getErrorMessage(), activation.getRequestId());
        }
    }
}



package ru.pskb.integrator.controller;

import lombok.RequiredArgsConstructor;
import org.springframework.http.HttpStatus;
import org.springframework.web.bind.annotation.*;
import ru.pskb.integrator.dto.activation.ActivationRequest;
import ru.pskb.integrator.dto.activation.ActivationResponse;
import ru.pskb.integrator.service.activation.ActivationService;

/**
 * ActivationController
 * - POST /activation — принимать запросы активации (п.2.6). Возвращает {status: "successful"/"failed"}.
 * - GET  /activation/{requestId} — возвращать текущий статус активации (п.2.7).
 *
 * Контроллер валидирует минимально входные параметры и делегирует бизнес-логике ActivationService.
 */
@RestController
@RequestMapping("/activation")
@RequiredArgsConstructor
public class ActivationController {

    private final ActivationService activationService;

    @PostMapping
    @ResponseStatus(HttpStatus.OK)
    public ActivationResponse activate(@RequestBody ActivationRequest request) {
        // минимальная валидация: must have requestId и хотя бы mplOfferId или bankOfferId
        if (request.requestId() == null || request.requestId().isBlank()) {
            return new ActivationResponse("failed", "requestId is required", null);
        }
        if ((request.mplOfferId() == null || request.mplOfferId().isBlank())
                && (request.bankOfferId() == null || request.bankOfferId().isBlank())) {
            return new ActivationResponse("failed", "one of mplOfferId or bankOfferId is required", request.requestId());
        }
        return activationService.activate(request);
    }

    @GetMapping("/{requestId}")
    @ResponseStatus(HttpStatus.OK)
    public ActivationResponse getStatus(@PathVariable String requestId,
                                        @RequestParam(value = "mplOfferId", required = false) String mplOfferId,
                                        @RequestParam(value = "bankOfferId", required = false) String bankOfferId) {
        if ((mplOfferId == null || mplOfferId.isBlank()) && (bankOfferId == null || bankOfferId.isBlank())) {
            return new ActivationResponse("failed", "one of mplOfferId or bankOfferId is required", requestId);
        }
        return activationService.getActivationStatus(requestId, mplOfferId, bankOfferId);
    }
}


package ru.pskb.integrator.scheduler;

import lombok.RequiredArgsConstructor;
import lombok.extern.slf4j.Slf4j;
import org.springframework.scheduling.annotation.Scheduled;
import org.springframework.stereotype.Component;
import ru.pskb.integrator.entity.activation.Activation;
import ru.pskb.integrator.repository.activation.ActivationRepository;
import ru.pskb.integrator.service.activation.ActivationService;

import java.util.List;

/**
 * ActivationRetryScheduler
 * Периодически (каждые 2 минуты) находит активации со статусом PENDING и пытается отправить их в ИБСО снова.
 *
 * Важно: в задаче используются методы ActivationService (который в свою очередь использует DirectIbsoService).
 */
@Slf4j
@Component
@RequiredArgsConstructor
public class ActivationRetryScheduler {

    private final ActivationRepository activationRepository;
    private final ActivationService activationService;

    @Scheduled(cron = "0 */2 * * * ?")
    public void retryPendingActivations() {
        List<Activation> pending = activationRepository.findByStatus("PENDING");
        if (pending.isEmpty()) {
            log.debug("ActivationRetryScheduler: нет PENDING активаций");
            return;
        }
        log.info("ActivationRetryScheduler: найдено {} PENDING активаций, пытаемся повторить отправку", pending.size());

        for (Activation a : pending) {
            try {
                activationService.getActivationStatus(a.getRequestId(), a.getMplOfferId(), a.getBankOfferId());
            } catch (Exception ex) {
                log.error("ActivationRetryScheduler: ошибка при повторной попытке для requestId={} : {}", a.getRequestId(), ex.getMessage());
            }
        }
    }
}


