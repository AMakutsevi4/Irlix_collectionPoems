import java.math.BigDecimal;
import java.time.LocalDateTime;
import java.util.List;
import java.util.UUID;

/**
 * Activation
 * Сущность — запись о попытке активации оффера (п.2.6).
 * Хранит входные параметры активации, текущий статус (PENDING / SUCCESSFUL / FAILED),
 * сообщение об ошибке и связь с коллекцией рефинансируемых кредитов.
 *
 * Взаимодействует:
 *  - контроллер /service (ActivationService) — для создания и получения статуса
 *  - scheduler (ActivationRetryScheduler) — для повторных попыток отправки в ИБСО
 *  - DirectIbsoService — для реального вызова активации/запроса статуса
 */
@Entity
@Table(name = "activation")
@Getter
@Setter
@Builder
@AllArgsConstructor
@NoArgsConstructor
public class Activation {

    @Id
    @GeneratedValue
    @Column(name = "id", nullable = false)
    private UUID id;

    @Column(name = "request_id", nullable = false)
    private String requestId;

    @Column(name = "mpl_offer_id")
    private String mplOfferId;

    @Column(name = "bank_offer_id")
    private String bankOfferId;

    @Column(name = "loan_amount", precision = 15, scale = 2)
    private BigDecimal loanAmount;

    @Column(name = "hand_amount", precision = 15, scale = 2)
    private BigDecimal handAmount;

    @Column(name = "term")
    private Integer term;

    @Column(name = "rate", precision = 6, scale = 4)
    private BigDecimal rate;

    @Column(name = "insurance")
    private Boolean insurance;

    @Column(name = "insurance_rate", precision = 6, scale = 4)
    private BigDecimal insuranceRate;

    @Column(name = "monthly_payment", precision = 15, scale = 2)
    private BigDecimal monthlyPayment;

    @Column(name = "insurance_payment", precision = 15, scale = 2)
    private BigDecimal insurancePayment;

    @Column(name = "refinanced_flag")
    private Boolean refinancedFlag;

    @Column(name = "status", nullable = false)
    private String status; // PENDING | SUCCESSFUL | FAILED

    @Column(name = "error_message")
    private String errorMessage;

    @OneToMany(mappedBy = "activation", cascade = CascadeType.ALL, orphanRemoval = true, fetch = FetchType.LAZY)
    private List<ActivationRefinancedLoan> refinancedLoans;

    @Column(name = "created_at")
    private LocalDateTime createdAt;

    @Column(name = "updated_at")
    private LocalDateTime updatedAt;
}

/**
 * ActivationRefinancedLoan
 * Строка с информацией по одному рефинансируемому кредиту, связанная с Activation.
