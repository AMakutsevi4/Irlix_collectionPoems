--liquibase formatted sql
--changeset alexandr:2025-11-16--create-activation-request-table
CREATE TABLE IF NOT EXISTS activation_request (
  id UUID PRIMARY KEY NOT NULL,
  request_id VARCHAR(255) NOT NULL UNIQUE,
  mpl_offer_id VARCHAR(255),
  bank_offer_id VARCHAR(255),
  loan_amount NUMERIC(19,2) NOT NULL,
  hand_amount NUMERIC(19,2) NOT NULL,
  term INTEGER NOT NULL,
  rate NUMERIC(5,2) NOT NULL,
  insurance BOOLEAN NOT NULL,
  insurance_rate NUMERIC(5,2),
  monthly_payment NUMERIC(19,2),
  insurance_payment NUMERIC(19,2),
  refinanced_payments_loans BOOLEAN DEFAULT FALSE,
  consent_assignment_rights BOOLEAN,
  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL,
  updated_at TIMESTAMP
);

--changeset alexandr:2025-11-16--create-activation-refinanced-loan-table
CREATE TABLE IF NOT EXISTS activation_refinanced_loan (
  id UUID PRIMARY KEY NOT NULL,
  activation_request_id UUID NOT NULL,
  identifier VARCHAR(255) NOT NULL,
  refinance_sum NUMERIC(19,2) NOT NULL,
  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL,
  updated_at TIMESTAMP,
  CONSTRAINT fk_activation_request
    FOREIGN KEY (activation_request_id)
    REFERENCES activation_request (id)
);

package ru.pskb.integrator.entity;

import jakarta.persistence.*;
import lombok.*;
import java.math.BigDecimal;
import java.time.LocalDateTime;
import java.util.ArrayList;
import java.util.List;
import java.util.UUID;

/**
 * Сущность хранит запрос на проверку актуальности оффера (ActivationCheck).
 * Отвечает за:
 *  - хранение параметров запроса (loanAmount, handAmount, term, rate и т.д.)
 *  - связь 1 -> N с таблицей рефинансируемых кредитов (ActivationRefinancedLoanEntity)
 *  - хранение метаданных created_at / updated_at
 *
 * Используется сервисом ActivationCheckService для сохранения, логирования и отправки в ИБСО.
 */
@Entity
@Table(name = "activation_request")
@Getter
@Setter
@AllArgsConstructor
@NoArgsConstructor
@Builder
public class ActivationRequestEntity {

    @Id
    @GeneratedValue
    private UUID id;

    @Column(name = "request_id", nullable = false, unique = true)
    private String requestId;

    @Column(name = "mpl_offer_id")
    private String mplOfferId;

    @Column(name = "bank_offer_id")
    private String bankOfferId;

    @Column(name = "loan_amount", nullable = false)
    private BigDecimal loanAmount;

    @Column(name = "hand_amount", nullable = false)
    private BigDecimal handAmount;

    @Column(name = "term", nullable = false)
    private Integer term;

    @Column(name = "rate", nullable = false)
    private BigDecimal rate;

    @Column(name = "insurance", nullable = false)
    private Boolean insurance;

    @Column(name = "insurance_rate")
    private BigDecimal insuranceRate;

    @Column(name = "monthly_payment")
    private BigDecimal monthlyPayment;

    @Column(name = "insurance_payment")
    private BigDecimal insurancePayment;

    @Column(name = "refinanced_payments_loans")
    private Boolean refinancedPaymentsLoans;

    @Column(name = "consent_assignment_rights")
    private Boolean consentAssignmentRights;

    @OneToMany(mappedBy = "activationRequest", cascade = CascadeType.ALL, orphanRemoval = true, fetch = FetchType.LAZY)
    private List<ActivationRefinancedLoanEntity> refinancedLoans = new ArrayList<>();

    @Column(name = "created_at")
    private LocalDateTime createdAt;

    @Column(name = "updated_at")
    private LocalDateTime updatedAt;
}

package ru.pskb.integrator.entity;

import jakarta.persistence.*;
import lombok.*;
import java.math.BigDecimal;
import java.time.LocalDateTime;
import java.util.UUID;

/**
 * Сущность — отдельная строка рефинансируемого кредита, связанная с ActivationRequestEntity.
 * Хранит identifier и рассчитанную/предложенную сумму refinanceSum.
 */
@Entity
@Table(name = "activation_refinanced_loan")
@Getter
@Setter
@AllArgsConstructor
@NoArgsConstructor
@Builder
public class ActivationRefinancedLoanEntity {

    @Id
    @GeneratedValue
    private UUID id;

    @ManyToOne(fetch = FetchType.LAZY)
    @JoinColumn(name = "activation_request_id", nullable = false)
    private ActivationRequestEntity activationRequest;

    @Column(name = "identifier", nullable = false)
    private String identifier;

    @Column(name = "refinance_sum", nullable = false)
    private BigDecimal refinanceSum;

    @Column(name = "created_at")
    private LocalDateTime createdAt;

    @Column(name = "updated_at")
    private LocalDateTime updatedAt;
}



