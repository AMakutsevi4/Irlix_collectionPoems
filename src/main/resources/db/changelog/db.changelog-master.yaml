package ru.pskb.integrator.dto.activation;

import java.math.BigDecimal;
import java.util.List;

/**
 * ActivationRequest
 * Входящая модель от маркетплейса (п.2.6). Содержит идентификаторы заявки/оффера,
 * параметы кредита, флаг рефинансирования и коллекцию рефинансируемых кредитов (если есть).
 *
 * Используется контроллером ActivationController и потом маппится в сущность Activation.
 */
public record ActivationRequest(
        String requestId,
        String mplOfferId,
        String bankOfferId,
        BigDecimal loanAmount,
        BigDecimal handAmount,
        Integer term,
        BigDecimal rate,
        Boolean insurance,
        BigDecimal insuranceRate,
        BigDecimal monthlyPayment,
        BigDecimal insurancePayment,
        Boolean refinancedPaymentsLoans,
        List<RefinancedLoanRequest> refinancedLoans,
        Boolean consentAssignmentRights
) {}

/**
 * Запись одного рефинансируемого кредита в запросе активации.
 */
public record RefinancedLoanRequest(
        String identifier,
        BigDecimal refinanceSum,
        String contractNumber,
        String accountNumber,
