package ru.pskb.integrator.mapper;

import org.mapstruct.*;
import ru.pskb.integrator.dto.activation.*;
import ru.pskb.integrator.entity.*;

import java.time.LocalDateTime;

/**
 * MapStruct маппер:
 * - преобразует ActivationCheckRequest -> ActivationRequestEntity
 * - преобразует ActivationRefinancedLoanDto -> ActivationRefinancedLoanEntity
 *
 * unmappedTargetPolicy = ReportingPolicy.IGNORE для удобства (можно менять на ERROR)
 */
@Mapper(componentModel = MappingConstants.ComponentModel.SPRING, unmappedTargetPolicy = ReportingPolicy.IGNORE)
public interface ActivationCheckMapper {

    @Mapping(target = "id", ignore = true)
    @Mapping(target = "refinancedLoans", ignore = true) // наполняем вручную, чтобы проставить ссылку на parent
    @Mapping(target = "createdAt", expression = "java(java.time.LocalDateTime.now())")
    @Mapping(target = "updatedAt", expression = "java(java.time.LocalDateTime.now())")
    ActivationRequestEntity dtoToEntity(ActivationCheckRequest dto);

    @Mapping(target = "id", ignore = true)
    @Mapping(target = "activationRequest", ignore = true) // установим вручную
    @Mapping(target = "createdAt", expression = "java(java.time.LocalDateTime.now())")
    @Mapping(target = "updatedAt", expression = "java(java.time.LocalDateTime.now())")
    ActivationRefinancedLoanEntity refinancedDtoToEntity(ActivationRefinancedLoanDto dto);

    // опционально — entity -> dto (если понадобится)
    ActivationRefinancedLoanDto refinancedEntityToDto(ActivationRefinancedLoanEntity entity);
}


package ru.pskb.integrator.service;

import ru.pskb.integrator.dto.activation.ActivationCheckRequest;
import ru.pskb.integrator.dto.activation.ActivationCheckResponse;

/**
 * Сервис для обработки ActivationCheck.
 * Сохраняет входной запрос, сохраняет/обновляет refinancedLoans,
 * логирует изменения и отправляет запрос в ИБСО (через DirectIbsoService).
 */
public interface ActivationCheckService {
    ActivationCheckResponse processActivationCheck(ActivationCheckRequest request);
}


package ru.pskb.integrator.service.impl;

import lombok.RequiredArgsConstructor;
import lombok.extern.slf4j.Slf4j;
import org.springframework.stereotype.Service;
import org.springframework.transaction.annotation.Transactional;
import ru.pskb.integrator.dto.activation.*;
import ru.pskb.integrator.entity.*;
import ru.pskb.integrator.mapper.ActivationCheckMapper;
import ru.pskb.integrator.repository.*;
import ru.pskb.integrator.service.ActivationCheckService;
import ru.pskb.integrator.ibso.DirectIbsoService;
import ru.pskb.integrator.logging.ApplicationHistoryLogger; // предполагаемый интерфейс логгера

import java.util.List;
import java.util.UUID;
import java.util.stream.Collectors;

/**
 * Реализация сервиса:
 * 1) Валидирует минимально входные поля (requestId, loanAmount, handAmount, term, rate, insurance если true -> insuranceRate)
 * 2) Сохраняет главный entity (activation_request)
 * 3) Если refinancedPaymentsLoans = true, сохраняет коллекцию activation_refinanced_loan
 * 4) Логирует изменение через ApplicationHistoryLogger
 * 5) Отправляет payload в ИБСО через DirectIbsoService.sendActivationCheck(...)
 *
 * Важное: вся операция в одной транзакции, чтобы не было частично сохранённых данных.
 */
@Slf4j
@Service
@RequiredArgsConstructor
public class ActivationCheckServiceImpl implements ActivationCheckService {

    private final ActivationRequestRepository activationRequestRepository;
    private final ActivationRefinancedLoanRepository refinancedLoanRepository;
    private final ActivationCheckMapper mapper;
    private final DirectIbsoService ibsoService;
    private final ApplicationHistoryLogger historyLogger;

    @Override
    @Transactional
    public ActivationCheckResponse processActivationCheck(ActivationCheckRequest request) {
        log.info("Получен ActivationCheck requestId={} mplOfferId={} bankOfferId={}",
                request.requestId(), request.mplOfferId(), request.bankOfferId());

        // 1) минимальная валидация входа
        validateRequest(request);

        // 2) Сохраняем основную сущность
        ActivationRequestEntity entity = mapper.dtoToEntity(request);
        // проставим requestId — убеждаемся что оно есть
        entity.setRequestId(request.requestId());

        ActivationRequestEntity saved = activationRequestRepository.save(entity);
        log.info("Сохранён activation_request id={} requestId={}", saved.getId(), saved.getRequestId());

        // 3) Сохраняем refinancedLoans если есть
        if (Boolean.TRUE.equals(request.refinancedPaymentsLoans()) && request.refinancedLoans() != null) {
            List<ActivationRefinancedLoanEntity> rows = request.refinancedLoans().stream()
                    .map(dto -> {
                        ActivationRefinancedLoanEntity row = mapper.refinancedDtoToEntity(dto);
                        row.setActivationRequest(saved);
                        return row;
                    })
                    .collect(Collectors.toList());

            refinancedLoanRepository.saveAll(rows);
            // привяжем к saved
            saved.getRefinancedLoans().clear();
            saved.getRefinancedLoans().addAll(rows);
            // обновим updatedAt
            saved.setUpdatedAt(java.time.LocalDateTime.now());
            activationRequestRepository.save(saved);
            log.info("Сохранены {} записей refinancedLoans для activation_request id={}", rows.size(), saved.getId());

            historyLogger.logChange(
                    saved.getRequestId(),
                    "ACTIVATION_CHECK_REFINANCE_ADDED",
                    saved.getLoanAmount(),
                    saved.getTerm(),
                    null,
                    "Добавлены кредиты для рефинансирования: " + rows.size()
            );
        } else {
            historyLogger.logChange(
                    saved.getRequestId(),
                    "ACTIVATION_CHECK_RECEIVED",
                    saved.getLoanAmount(),
                    saved.getTerm(),
                    null,
                    "Получен запрос проверки актуальности оффера"
            );
        }

        // 4) Отправляем в ИБСО (stub / TODO)
        // В ibsoService реализовать sendActivationCheck(ActivationRequestEntity) — формирует json и посылает.
        try {
            ibsoService.sendActivationCheck(saved); // TODO: в будущем эту операцию можно вынести в async
        } catch (Exception ex) {
            log.error("Ошибка при отправке в ИБСО для requestId={} : {}", saved.getRequestId(), ex.getMessage(), ex);
            return new ActivationCheckResponse("failed", null, "Ошибка при отправке в ИБСО: " + ex.getMessage());
        }

        // 5) Успешный ответ приёма
        return new ActivationCheckResponse("successful", saved.getRequestId(), null);
    }

    private void validateRequest(ActivationCheckRequest r) {
        if (r.requestId() == null || r.requestId().isBlank()) {
            throw new IllegalArgumentException("requestId обязателен");
        }
        if (r.loanAmount() == null || r.loanAmount().signum() <= 0) {
            throw new IllegalArgumentException("loanAmount должен быть положительным");
        }
        if (r.handAmount() == null || r.handAmount().signum() < 0) {
            throw new IllegalArgumentException("handAmount должен быть неотрицательным");
        }
        if (r.term() == null || r.term() <= 0) {
            throw new IllegalArgumentException("term обязателен и должен быть > 0");
        }
        if (r.rate() == null || r.rate().signum() <= 0) {
            throw new IllegalArgumentException("rate обязателен и должен быть положительным");
        }
        if (Boolean.TRUE.equals(r.insurance()) && (r.insuranceRate() == null || r.insuranceRate().signum() <= 0)) {
            throw new IllegalArgumentException("insuranceRate обязателен если insurance=true");
        }
        // если refinancedPaymentsLoans=true, коллекция не должна быть пустой
        if (Boolean.TRUE.equals(r.refinancedPaymentsLoans()) && (r.refinancedLoans() == null || r.refinancedLoans().isEmpty())) {
            throw new IllegalArgumentException("refinancedLoans обязателен когда refinancedPaymentsLoans=true");
        }
    }
}


package ru.pskb.integrator.controller;

import lombok.RequiredArgsConstructor;
import lombok.extern.slf4j.Slf4j;
import org.springframework.http.HttpStatus;
import org.springframework.web.bind.annotation.*;
import ru.pskb.integrator.dto.activation.*;
import ru.pskb.integrator.service.ActivationCheckService;

/**
 * Контроллер для ActivationCheck (POST /activationCheck).
 * Комментарии и логи на русском для удобства.
 */
@Slf4j
@RestController
@RequestMapping("/activation")
@RequiredArgsConstructor
public class ActivationController {

    private final ActivationCheckService activationCheckService;

    @PostMapping("/check")
    @ResponseStatus(HttpStatus.OK)
    public ActivationCheckResponse checkActivation(@RequestBody ActivationCheckRequest request) {
        log.info("Получен call /activation/check requestId={}", request.requestId());
        return activationCheckService.processActivationCheck(request);
    }
}


